<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Haakpatroon-generator</title>
<style>
:root{--bg:#faf7f2;--card:#fff;--ink:#2b2622;--mute:#7a716a;--line:#e3dcd2;--accent:#c4553a;--accent-ink:#fff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{padding:22px 24px 8px;max-width:1400px;margin:auto}
header h1{margin:0;font-size:26px;letter-spacing:-.02em}
header p{margin:4px 0 0;color:var(--mute)}
.layout{display:grid;grid-template-columns:320px 1fr;gap:20px;max-width:1400px;margin:auto;padding:16px 24px 48px;align-items:start}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
aside .card{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}
h2{margin:0 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute)}
.group{margin-bottom:18px}
.group:last-child{margin-bottom:0}
label{display:block;font-size:13px;color:var(--mute);margin:8px 0 3px}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1;min-width:0}
input[type=number],select{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:#fff;font:inherit;color:inherit}
input[type=range]{width:100%;accent-color:var(--accent)}
.chk{display:flex;gap:8px;align-items:center;color:var(--ink);font-size:14px;margin:6px 0}
.chk input{accent-color:var(--accent)}
.drop{display:block;border:2px dashed var(--line);border-radius:10px;padding:18px 10px;text-align:center;color:var(--mute);cursor:pointer;transition:.15s;margin:0;font-size:14px}
.drop:hover,.drop.over{border-color:var(--accent);color:var(--accent);background:#fdf3ef}
.drop input{display:none}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 12px;color:var(--ink)}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.main{display:flex;flex-direction:column;gap:20px;min-width:0}
.stats{display:flex;flex-wrap:wrap;gap:8px 24px;font-size:14px;margin-bottom:12px}
.stats b{display:block;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--mute)}
.gridwrap{overflow:auto;max-height:76vh;border:1px solid var(--line);border-radius:8px;background:#fff}
canvas{display:block}
.hover{min-height:22px;margin-top:8px;font-size:13px;color:var(--mute)}
.legend{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.leg{display:flex;align-items:center;gap:10px;padding:8px;border:1px solid var(--line);border-radius:10px}
.sw{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;font-weight:700;border:1px solid rgba(0,0,0,.15);flex:none;position:relative;overflow:hidden}
.sw input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;padding:0;border:0}
.leg small{color:var(--mute);display:block;line-height:1.3}
ol.steps{margin:0;padding:0;list-style:none;columns:2 420px;column-gap:24px}
ol.steps li{break-inside:avoid;padding:7px 10px;border-bottom:1px solid var(--line);cursor:pointer;font-size:14px}
ol.steps li:hover{background:#fdf3ef}
ol.steps li.done{opacity:.4;text-decoration:line-through}
ol.steps b{margin-right:6px}
ol.steps .dir{color:var(--mute);font-size:12px;margin-right:6px}
.intro{margin:0 0 12px;color:var(--mute);font-size:14px}
.empty{color:var(--mute)}
@media(max-width:900px){.layout{grid-template-columns:1fr;padding:12px}aside .card{position:static;max-height:none}header{padding:16px 12px 0}}
@media print{
  body{background:#fff}
  header p,aside,.hover,.noprint{display:none!important}
  .layout{display:block;padding:0}
  .card{border:0;padding:0;margin-bottom:16px}
  .gridwrap{max-height:none;overflow:visible;border:0}
  .gridwrap canvas{max-width:100%;height:auto!important}
  ol.steps{columns:2}
}
</style>
</head>
<body>
<header>
  <h1>Haakpatroon-generator</h1>
  <p>Upload een afbeelding en krijg een haakpatroon met kleurenschema, legenda en rij-voor-rij-instructies.</p>
</header>

<div class="layout">
<aside>
 <div class="card">
  <div class="group">
    <h2>Afbeelding</h2>
    <label class="drop" id="drop"><input type="file" id="file" accept="image/*">Sleep een afbeelding hierheen<br>of klik om te kiezen</label>
    <div class="btns" style="margin-top:8px"><button id="demo" type="button">Voorbeeld laden</button></div>
  </div>

  <div class="group">
    <h2>Patroon</h2>
    <label for="tech">Techniek</label>
    <select id="tech">
      <option value="tapestry">Tapestry / pixel (vasten, rij voor rij)</option>
      <option value="c2c">C2C (hoek tot hoek, diagonalen)</option>
    </select>
    <label for="w">Breedte (steken)</label>
    <div class="row"><input type="range" id="wr" min="10" max="200" value="50"><input type="number" id="w" min="5" max="300" value="50" style="max-width:76px"></div>
    <label for="h">Hoogte (rijen)</label>
    <input type="number" id="h" min="5" max="300" value="50">
    <div class="chk"><input type="checkbox" id="lock" checked><label for="lock" style="margin:0;color:inherit;font-size:14px">Verhouding behouden</label></div>
    <label for="k">Aantal kleuren: <b id="kv">6</b></label>
    <input type="range" id="k" min="2" max="20" value="6">
    <div class="chk" id="altwrap"><input type="checkbox" id="alt" checked><label for="alt" style="margin:0;color:inherit;font-size:14px">Wissel richting per rij</label></div>
  </div>

  <div class="group">
    <h2>Afmeting &amp; garen</h2>
    <div class="row">
      <div><label for="gs">Steken / 10 cm</label><input type="number" id="gs" value="14" min="1" step="0.5"></div>
      <div><label for="gr">Rijen / 10 cm</label><input type="number" id="gr" value="15" min="1" step="0.5"></div>
    </div>
    <label for="cm">Garen per steek (cm)</label>
    <input type="number" id="cm" value="5" min="1" step="0.5">
  </div>

  <div class="group">
    <h2>Weergave</h2>
    <label for="zoom">Zoom</label>
    <input type="range" id="zoom" min="4" max="40" value="14">
    <div class="chk"><input type="checkbox" id="sym" checked><label for="sym" style="margin:0;color:inherit;font-size:14px">Letters in vakjes</label></div>
    <div class="chk"><input type="checkbox" id="num" checked><label for="num" style="margin:0;color:inherit;font-size:14px">Rij- en kolomnummers</label></div>
  </div>

  <div class="btns">
    <button class="primary" id="png" type="button">Download PNG</button>
    <button id="txt" type="button">Download tekst</button>
    <button id="print" type="button">Afdrukken</button>
  </div>
 </div>
</aside>

<div class="main">
  <section class="card">
    <h2>Patroon</h2>
    <div class="stats" id="stats"></div>
    <div class="gridwrap"><canvas id="cv"></canvas></div>
    <div class="hover" id="hover"></div>
  </section>
  <section class="card">
    <h2>Legenda &amp; garen <span class="noprint" style="text-transform:none;letter-spacing:0">(klik op een kleur om te wijzigen)</span></h2>
    <div class="legend" id="legend"></div>
  </section>
  <section class="card">
    <h2>Instructies <span class="noprint" style="text-transform:none;letter-spacing:0">(klik op een regel om af te vinken)</span></h2>
    <p class="intro" id="intro"></p>
    <ol class="steps" id="steps"></ol>
  </section>
</div>
</div>

<script>
const $=s=>document.querySelector(s);
const LET='ABCDEFGHIJKLMNOPQRSTUVWXYZ';
const st={img:null,W:0,H:0,grid:null,pal:[],lines:[],intro:''};

/* ---------- afbeelding laden ---------- */
const dim=s=>[s.naturalWidth||s.width,s.naturalHeight||s.height];

function loadFile(f){
  if(!f||!f.type.startsWith('image/'))return;
  const url=URL.createObjectURL(f),im=new Image();
  im.onload=()=>{setImage(im);URL.revokeObjectURL(url)};
  im.src=url;
}
function setImage(src){
  st.img=src;
  const [w,h]=dim(src),W=+$('#w').value;
  $('#h').value=Math.max(5,Math.round(W*h/w));
  generate();
}
function demoImage(){
  const c=document.createElement('canvas');c.width=c.height=120;
  const g=c.getContext('2d');
  const sky=g.createLinearGradient(0,0,0,120);sky.addColorStop(0,'#5aa9e6');sky.addColorStop(1,'#cfeaf7');
  g.fillStyle=sky;g.fillRect(0,0,120,120);
  g.fillStyle='#ffd23f';g.beginPath();g.arc(88,30,16,0,7);g.fill();
  g.fillStyle='#3b8b4a';g.beginPath();g.ellipse(30,120,60,38,0,Math.PI,0);g.fill();
  g.fillStyle='#2c6e3c';g.beginPath();g.ellipse(95,120,50,28,0,Math.PI,0);g.fill();
  g.fillStyle='#d62839';g.beginPath();
  g.moveTo(40,70);g.bezierCurveTo(40,52,18,52,18,68);g.bezierCurveTo(18,82,40,92,40,100);
  g.bezierCurveTo(40,92,62,82,62,68);g.bezierCurveTo(62,52,40,52,40,70);g.fill();
  setImage(c);
}

/* ---------- verkleinen ---------- */
function downscale(src,w,h){
  let [cw,ch]=dim(src),cur=src;
  const mk=(a,b)=>{const c=document.createElement('canvas');c.width=a;c.height=b;const g=c.getContext('2d',{willReadFrequently:true});g.fillStyle='#fff';g.fillRect(0,0,a,b);g.imageSmoothingEnabled=true;g.imageSmoothingQuality='high';return[c,g]};
  while(cw/2>w*2&&ch/2>h*2){
    cw=Math.ceil(cw/2);ch=Math.ceil(ch/2);
    const[c,g]=mk(cw,ch);g.drawImage(cur,0,0,cw,ch);cur=c;
  }
  const[c,g]=mk(w,h);g.drawImage(cur,0,0,w,h);return c;
}

/* ---------- k-means kleurreductie ---------- */
function kmeans(px,n,k){
  let s=12345;const rnd=()=>{s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
  const D=(i,c)=>{const a=px[i*3]-c[0],b=px[i*3+1]-c[1],d=px[i*3+2]-c[2];return 2*a*a+4*b*b+3*d*d};
  const cs=[[px[0],px[1],px[2]]];
  const first=Math.floor(rnd()*n);cs[0]=[px[first*3],px[first*3+1],px[first*3+2]];
  const minD=new Float64Array(n).fill(Infinity);
  while(cs.length<k){
    const last=cs[cs.length-1];let sum=0;
    for(let i=0;i<n;i++){const d=D(i,last);if(d<minD[i])minD[i]=d;sum+=minD[i]}
    if(sum===0)break;
    let r=rnd()*sum,idx=n-1;
    for(let i=0;i<n;i++){r-=minD[i];if(r<=0){idx=i;break}}
    cs.push([px[idx*3],px[idx*3+1],px[idx*3+2]]);
  }
  const K=cs.length,as=new Uint8Array(n);
  for(let it=0;it<16;it++){
    let ch=false;
    for(let i=0;i<n;i++){
      let b=0,bd=Infinity;
      for(let j=0;j<K;j++){const d=D(i,cs[j]);if(d<bd){bd=d;b=j}}
      if(as[i]!==b||it===0){ch=ch||as[i]!==b;as[i]=b}
    }
    const sm=new Float64Array(K*3),ct=new Int32Array(K);
    for(let i=0;i<n;i++){const j=as[i];sm[j*3]+=px[i*3];sm[j*3+1]+=px[i*3+1];sm[j*3+2]+=px[i*3+2];ct[j]++}
    for(let j=0;j<K;j++)if(ct[j])cs[j]=[sm[j*3]/ct[j],sm[j*3+1]/ct[j],sm[j*3+2]/ct[j]];
    if(!ch&&it>0)break;
  }
  const cnt=new Int32Array(K);for(let i=0;i<n;i++)cnt[as[i]]++;
  const order=[...Array(K).keys()].filter(j=>cnt[j]>0).sort((a,b)=>cnt[b]-cnt[a]);
  const remap=new Int16Array(K).fill(-1);order.forEach((j,i)=>remap[j]=i);
  const grid=new Uint8Array(n);for(let i=0;i<n;i++)grid[i]=remap[as[i]];
  return{grid,pal:order.map(j=>cs[j].map(Math.round))};
}

/* ---------- genereren ---------- */
function generate(){
  if(!st.img)return;
  const W=clamp(+$('#w').value,5,300),H=clamp(+$('#h').value,5,300),K=+$('#k').value;
  const c=downscale(st.img,W,H),d=c.getContext('2d').getImageData(0,0,W,H).data,n=W*H;
  const px=new Float32Array(n*3);
  for(let i=0;i<n;i++){px[i*3]=d[i*4];px[i*3+1]=d[i*4+1];px[i*3+2]=d[i*4+2]}
  const r=kmeans(px,n,K);
  st.W=W;st.H=H;st.grid=r.grid;st.pal=r.pal.map(rgb=>({rgb}));
  buildInstructions();
  fit();
  renderAll();
}
function fit(){
  const avail=Math.max(300,($('.main').clientWidth||900)-70);
  $('#zoom').value=clamp(Math.floor(avail/(st.W+2)),4,40);
}
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v||a));
const hex=rgb=>'#'+rgb.map(v=>v.toString(16).padStart(2,'0')).join('');
const lum=rgb=>(0.299*rgb[0]+0.587*rgb[1]+0.114*rgb[2]);
const fmt=(v,dgt=1)=>v.toLocaleString('nl-NL',{maximumFractionDigits:dgt});

/* ---------- instructies ---------- */
function runs(cells){
  const out=[];
  for(const v of cells){
    if(out.length&&out[out.length-1][0]===v)out[out.length-1][1]++;
    else out.push([v,1]);
  }
  return out.map(([v,c])=>c+'× '+LET[v]).join(', ');
}
function buildInstructions(){
  const{W,H,grid}=st,tech=$('#tech').value,alt=$('#alt').checked,L=[];
  if(tech==='tapestry'){
    st.intro=`Haak met vasten. Begin met ${W+1} lossen en haak de eerste vaste in de 2e losse vanaf de naald (${W} steken). Rij 1 is de onderste rij van het schema; tel kolommen vanaf rechts. Wissel van kleur in de laatste omslag van de vorige steek en draag de ongebruikte kleur mee onder je steken.`;
    for(let r=1;r<=H;r++){
      const y=H-r,rtl=alt?r%2===1:true;
      const cells=[];
      if(rtl)for(let x=W-1;x>=0;x--)cells.push(grid[y*W+x]);
      else for(let x=0;x<W;x++)cells.push(grid[y*W+x]);
      L.push({t:'Rij '+r,d:(alt?(rtl?'van rechts naar links':'van links naar rechts'):'van rechts naar links')+' · '+W+' st',b:runs(cells)});
    }
  }else{
    st.intro=`Haak hoek tot hoek met blokjes (bijv. 3 lossen + 1 stokje in de 3e losse, daarna blokjes van 3 lossen + 2 stokjes). Begin in de rechteronderhoek van het schema. Elke diagonaal loopt om en om omhoog en omlaag; meerder of minder aan het begin van de diagonaal zoals aangegeven.`;
    let prev=0;
    for(let k=1;k<=W+H-1;k++){
      const cells=[];
      for(let yb=0;yb<H;yb++){
        const xr=k-1-yb;if(xr<0||xr>=W)continue;
        cells.push({yb,v:grid[(H-1-yb)*W+(W-1-xr)]});
      }
      cells.sort((a,b)=>k%2?a.yb-b.yb:b.yb-a.yb);
      const len=cells.length,fase=len>prev?'meerderen':len<prev?'minderen':'gelijk';
      prev=len;
      L.push({t:'Diagonaal '+k,d:(k%2?'van onder naar boven':'van boven naar onder')+' · '+len+' blokjes · '+fase,b:runs(cells.map(c=>c.v))});
    }
  }
  st.lines=L;
}

/* ---------- tekenen ---------- */
function drawGrid(cv,cell,o,dpr){
  const{W,H,grid,pal}=st,m=o.numbers?30:0,w=W*cell+2*m,h=H*cell+2*m;
  cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);cv.style.width=w+'px';cv.style.height=h+'px';
  const g=cv.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);
  g.fillStyle='#fff';g.fillRect(0,0,w,h);
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    g.fillStyle=hex(pal[grid[y*W+x]].rgb);g.fillRect(m+x*cell,m+y*cell,cell,cell);
  }
  if(o.symbols&&cell>=12){
    g.font='600 '+Math.floor(cell*.55)+'px system-ui,sans-serif';g.textAlign='center';g.textBaseline='middle';
    for(let y=0;y<H;y++)for(let x=0;x<W;x++){
      const p=pal[grid[y*W+x]].rgb;
      g.fillStyle=lum(p)>140?'rgba(0,0,0,.75)':'rgba(255,255,255,.9)';
      g.fillText(LET[grid[y*W+x]],m+x*cell+cell/2,m+y*cell+cell/2+1);
    }
  }
  if(cell>=6){
    g.strokeStyle='rgba(0,0,0,.2)';g.lineWidth=1;g.beginPath();
    for(let i=0;i<=W;i++){const X=m+i*cell+.5;g.moveTo(X,m);g.lineTo(X,m+H*cell)}
    for(let i=0;i<=H;i++){const Y=m+i*cell+.5;g.moveTo(m,Y);g.lineTo(m+W*cell,Y)}
    g.stroke();
  }
  g.strokeStyle='rgba(0,0,0,.65)';g.lineWidth=1.5;g.beginPath();
  for(let i=0;i<=W;i++)if((W-i)%10===0){const X=m+i*cell+.5;g.moveTo(X,m);g.lineTo(X,m+H*cell)}
  for(let i=0;i<=H;i++)if((H-i)%10===0){const Y=m+i*cell+.5;g.moveTo(m,Y);g.lineTo(m+W*cell,Y)}
  g.stroke();
  g.strokeRect(m+.5,m+.5,W*cell,H*cell);
  if(o.numbers){
    const step=cell>=22?1:cell>=12?5:10;
    g.fillStyle='#555';g.font='11px system-ui,sans-serif';g.textAlign='center';g.textBaseline='middle';
    const show=n=>n===1||n%step===0;
    for(let x=0;x<W;x++){const n=W-x;if(!show(n))continue;
      g.fillText(n,m+x*cell+cell/2,m/2);g.fillText(n,m+x*cell+cell/2,m+H*cell+m/2)}
    for(let y=0;y<H;y++){const n=H-y;if(!show(n))continue;
      g.fillText(n,m/2,m+y*cell+cell/2);g.fillText(n,m+W*cell+m/2,m+y*cell+cell/2)}
  }
  return{cell,m};
}
const opts=()=>({symbols:$('#sym').checked,numbers:$('#num').checked});
function redrawGrid(){
  if(!st.grid)return;
  st.layout=drawGrid($('#cv'),+$('#zoom').value,opts(),window.devicePixelRatio||1);
}
function counts(){
  const c=new Array(st.pal.length).fill(0);for(const v of st.grid)c[v]++;return c;
}
function renderAll(){
  if(!st.grid)return;
  const{W,H}=st,n=W*H,gs=+$('#gs').value||14,gr=+$('#gr').value||15,cm=+$('#cm').value||5;
  $('#stats').innerHTML=
    `<div><b>Steken</b>${W} × ${H} (${n})</div>`+
    `<div><b>Afmeting</b>≈ ${fmt(W/gs*10)} × ${fmt(H/gr*10)} cm</div>`+
    `<div><b>Kleuren</b>${st.pal.length}</div>`+
    `<div><b>Garen totaal</b>≈ ${fmt(n*cm/100)} m</div>`;
  const ct=counts();
  $('#legend').innerHTML=st.pal.map((p,i)=>
    `<div class="leg"><label class="sw" style="background:${hex(p.rgb)};color:${lum(p.rgb)>140?'#000':'#fff'};margin:0">${LET[i]}<input type="color" data-i="${i}" value="${hex(p.rgb)}"></label>`+
    `<div><b>Kleur ${LET[i]}</b> <small style="display:inline">${hex(p.rgb)}</small><small>${ct[i]} steken · ${fmt(ct[i]/n*100)}% · ≈ ${fmt(ct[i]*cm/100)} m</small></div></div>`).join('');
  $('#intro').textContent=st.intro;
  $('#steps').innerHTML=st.lines.map(l=>`<li><b>${l.t}</b><span class="dir">${l.d}</span>${l.b}</li>`).join('');
  $('#altwrap').style.display=$('#tech').value==='tapestry'?'':'none';
  redrawGrid();
}

/* ---------- export ---------- */
function download(name,blob){
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}
function exportPNG(){
  if(!st.grid)return;
  const c=document.createElement('canvas'),cell=24;
  drawGrid(c,cell,{symbols:true,numbers:true},1);
  const gw=c.width,gh=c.height,ct=counts(),cols=Math.max(1,Math.floor(Math.max(gw,360)/190)),rows=Math.ceil(st.pal.length/cols);
  const out=document.createElement('canvas');out.width=Math.max(gw,360);out.height=gh+rows*34+20;
  const g=out.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,out.width,out.height);
  g.drawImage(c,0,0);
  g.font='13px system-ui,sans-serif';g.textBaseline='middle';
  st.pal.forEach((p,i)=>{
    const x=10+(i%cols)*190,y=gh+10+Math.floor(i/cols)*34;
    g.fillStyle=hex(p.rgb);g.fillRect(x,y,26,26);g.strokeStyle='#0003';g.strokeRect(x+.5,y+.5,26,26);
    g.fillStyle=lum(p.rgb)>140?'#000':'#fff';g.textAlign='center';g.fillText(LET[i],x+13,y+14);
    g.fillStyle='#222';g.textAlign='left';g.fillText(hex(p.rgb)+' · '+ct[i]+' st',x+34,y+14);
  });
  out.toBlob(b=>download('haakpatroon.png',b));
}
function exportTXT(){
  if(!st.grid)return;
  const ct=counts();
  const t=['HAAKPATROON '+st.W+' × '+st.H,'','Kleuren:',
    ...st.pal.map((p,i)=>`  ${LET[i]} = ${hex(p.rgb)} (${ct[i]} steken)`),'',st.intro,'',
    ...st.lines.map(l=>`${l.t} (${l.d}): ${l.b}`)].join('\n');
  download('haakpatroon.txt',new Blob([t],{type:'text/plain;charset=utf-8'}));
}

/* ---------- events ---------- */
let timer;const later=f=>{clearTimeout(timer);timer=setTimeout(f,120)};
$('#file').onchange=e=>loadFile(e.target.files[0]);
const drop=$('#drop');
['dragenter','dragover'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('over')}));
['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('over')}));
drop.addEventListener('drop',e=>loadFile(e.dataTransfer.files[0]));
$('#demo').onclick=demoImage;

function ratio(){const[w,h]=st.img?dim(st.img):[1,1];return h/w}
function setW(v){
  $('#w').value=v;$('#wr').value=Math.min(200,v);
  if($('#lock').checked)$('#h').value=Math.max(5,Math.round(v*ratio()));
  later(generate);
}
$('#wr').oninput=e=>setW(+e.target.value);
$('#w').oninput=e=>{if(+e.target.value>=5)setW(+e.target.value)};
$('#h').oninput=e=>{
  if($('#lock').checked&&st.img){const v=Math.max(5,Math.round(+e.target.value/ratio()));$('#w').value=v;$('#wr').value=Math.min(200,v)}
  later(generate);
};
$('#k').oninput=e=>{$('#kv').textContent=e.target.value;later(generate)};
$('#tech').onchange=()=>{buildInstructions();renderAll()};
$('#alt').onchange=()=>{buildInstructions();renderAll()};
['#gs','#gr','#cm'].forEach(s=>$(s).oninput=renderAll);
$('#zoom').oninput=redrawGrid;
['#sym','#num'].forEach(s=>$(s).onchange=redrawGrid);
$('#legend').addEventListener('input',e=>{
  const i=e.target.dataset.i;if(i===undefined)return;
  const v=e.target.value;st.pal[i].rgb=[1,3,5].map(k=>parseInt(v.slice(k,k+2),16));
  const sw=e.target.parentElement;sw.style.background=v;sw.style.color=lum(st.pal[i].rgb)>140?'#000':'#fff';
  e.target.closest('.leg').querySelector('small').textContent=v;
  redrawGrid();
});
$('#steps').addEventListener('click',e=>{const li=e.target.closest('li');if(li)li.classList.toggle('done')});
$('#png').onclick=exportPNG;$('#txt').onclick=exportTXT;$('#print').onclick=()=>window.print();
$('#cv').addEventListener('mousemove',e=>{
  if(!st.layout)return;
  const{cell,m}=st.layout,x=Math.floor((e.offsetX-m)/cell),y=Math.floor((e.offsetY-m)/cell);
  const el=$('#hover');
  if(x<0||y<0||x>=st.W||y>=st.H){el.textContent='';return}
  const v=st.grid[y*st.W+x];
  el.textContent=`Kolom ${st.W-x} (vanaf rechts) · rij ${st.H-y} (vanaf onder) · kleur ${LET[v]} ${hex(st.pal[v].rgb)}`;
});
$('#cv').addEventListener('mouseleave',()=>$('#hover').textContent='');
window.addEventListener('beforeprint',()=>{});
demoImage();
</script>
</body>
</html>
